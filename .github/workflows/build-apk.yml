name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"
          JAVA_MAJOR_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F. '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $JAVA_MAJOR_VER"
          if [ -z "$JAVA_MAJOR_VER" ]; then
            echo "Error: Unable to detect Java major version."
            exit 1
          fi
          if [ "$JAVA_MAJOR_VER" -lt 17 ]; then
            echo "Error: Detected Java version $JAVA_MAJOR_VER is lower than required Java 17."
            exit 1
          fi
          echo "Java environment verified successfully: Java $JAVA_MAJOR_VER (>= 17)."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in repository root."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to find or generate ./debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Expected debug APK $TARGET_APK does not exist."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files under app/build/outputs/apk:"
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk was not created."
            fi
            exit 1
          fi
          if [ ! -s "$TARGET_APK" ]; then
            echo "Error: Debug APK $TARGET_APK is empty."
            exit 1
          fi
          case "$TARGET_APK" in
            *.apk) ;;
            *)
              echo "Error: File $TARGET_APK does not have the .apk extension."
              exit 1
              ;;
          esac
          if [ "$TARGET_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Selected APK path does not match app/build/outputs/apk/debug/app-debug.apk."
            exit 1
          fi
          echo "Verified debug APK: $TARGET_APK (size: $(wc -c < "$TARGET_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release
        run: |
          REPO_RAW="${{ github.repository }}"
          REPO_BASE=$(basename "$REPO_RAW")
          SAFE_REPO_NAME=$(echo "$REPO_BASE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi
          RELEASE_TMP_DIR="${{ runner.temp }}/release_assets"
          mkdir -p "$RELEASE_TMP_DIR"
          ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${RELEASE_TMP_DIR}/${ASSET_NAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"
          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset was not created or is empty."
            exit 1
          fi
          echo "Prepared release asset: $ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release.outputs.asset_path }}
          TAG_NAME: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          RELEASE_TITLE: "Debug APK Build #${{ github.run_number }}"
        run: |
          gh --version
          if ! command -v gh &> /dev/null; then
            echo "Error: GitHub CLI (gh) is not available on runner."
            exit 1
          fi
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset $ASSET_PATH is missing or empty."
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "Error: Release asset $ASSET_PATH is not an .apk file."
              exit 1
              ;;
          esac

          RELEASE_NOTES="### SANI MATH GUIDE - Debug APK Build
          - **Build Type**: Automatically generated debug APK
          - **Built by**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit**: ${{ github.sha }}
          - **Testing Notice**: This APK is intended for testing and verification. It is signed with a temporary debug keystore and is not a Play Store production release."

          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.create_release.outcome }}
          TAG_NAME: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          ASSET_NAME: ${{ steps.prepare_release.outputs.asset_name }}
        run: |
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "GitHub Release publishing succeeded."
            RELEASE_JSON=$(gh release view "$TAG_NAME" --json tagName,title,url 2>/dev/null || echo "{}")
            RELEASE_URL=$(echo "$RELEASE_JSON" | grep -o '"url":"[^"]*' | cut -d'"' -f4)
            RELEASE_TAG=$(echo "$RELEASE_JSON" | grep -o '"tagName":"[^"]*' | cut -d'"' -f4)
            RELEASE_TITLE=$(echo "$RELEASE_JSON" | grep -o '"title":"[^"]*' | cut -d'"' -f4)

            echo "Release Tag: ${RELEASE_TAG:-$TAG_NAME}"
            echo "Release Title: ${RELEASE_TITLE:-Debug APK Build #${{ github.run_number }}}"
            echo "Release URL: ${RELEASE_URL}"
            echo "Asset Name: $ASSET_NAME"

            {
              echo "### 🚀 Debug APK Published to GitHub Releases"
              echo "- **Release Title**: ${RELEASE_TITLE:-Debug APK Build #${{ github.run_number }}}"
              echo "- **Release Tag**: \`${RELEASE_TAG:-$TAG_NAME}\`"
              if [ -n "$RELEASE_URL" ]; then
                echo "- **Download URL**: [Direct GitHub Release Page]($RELEASE_URL)"
              fi
              echo "- **Release Asset**: \`$ASSET_NAME\` (available directly under the release **Assets** section)"
              echo ""
              echo "📦 **Backup Artifact**: The standard Actions artifact \`app-debug-apk\` is also preserved in this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release creation did not complete. Check permissions or GitHub Releases access."
            echo "Notice: APK build and upload-artifact succeeded."
            echo "The debug APK artifact 'app-debug-apk' remains available for download."

            {
              echo "### ⚠️ Debug APK Built - Release Notice"
              echo "- **APK Build**: ✅ Succeeded"
              echo "- **Artifact Upload**: ✅ Succeeded (\`app-debug-apk\`)"
              echo "- **GitHub Release Publishing**: ⚠️ Not completed or permission restricted"
              echo "- **Download APK**: You can download the APK directly from the **Artifacts** section of this GitHub Actions run summary page."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
